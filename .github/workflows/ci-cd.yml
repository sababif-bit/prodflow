name: CI/CD

on:
  push:
    branches: [main]
  # every pull request, also those stacked on another feature branch (their base is not main)
  pull_request:

# least privilege: only the build job may write packages (a compromised test dependency must not be able to move the "prod" tag)
permissions:
  contents: read

jobs:
  # 1) TEST - runs on every push and pull request
  test:
    # Pinned (Issue #7): GitHub moves ubuntu-latest to Ubuntu 26.04 gradually from 2026-10-19 (actions/runner-images#14748).
    # To revert, replace ubuntu-24.04 with ubuntu-latest in all three jobs.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests (Testcontainers starts PostgreSQL in Docker)
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports

  # 1b) FRONTEND - the Angular application (frontend/): lint, unit tests, production build. Runs on every push and pull request.
  #      The browser tests (Playwright, frontend/e2e) need the disposable Docker stack and are run locally before a release
  #      (docs/frontend-architecture.md); scripts/test-prod-stack.sh runs a browser test through Caddy as well.
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Unit tests
        run: npm test -- --no-watch
      - name: Production build
        run: npm run build

  # 1c) OPS - tests of the deployment scripts and of the Caddyfile (CSP, cache headers, hostnames). No server and no secrets needed.
  ops:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deployment agent and health/application gate (fake docker)
        run: bash scripts/test-deploy-agent.sh
      - name: Caddyfile (real Caddy image, offline)
        run: bash scripts/test-caddyfile.sh

  # 2) BUILD - only on main, only if tests are green. Publishes sha-<commit>, latest and the pointer "prod" that the server agent
  #    pulls (pull-based deployment, Issue #18: no inbound SSH). The commit is baked into the image (GET /version, OCI label).
  build:
    needs: [test, frontend, ops]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # only the newest main commit is built and rolled out; an older run is cancelled instead of racing the newer one
    concurrency:
      group: release
      cancel-in-progress: true
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # repository root: the image contains the Angular application (frontend/) and the backend (backend/)
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:prod
      - name: Summary (what a green build means)
        run: |
          {
            echo "### Image published: ${{ steps.meta.outputs.tag }} (also moved the pointer \`prod\`)"
            echo "A green build means **the image exists**, not that it is deployed. The server agent pulls it within about a minute;"
            echo "the **Verify** job proves it from outside (needs the repository variable \`PROD_APP_URL\`; a grey/skipped Verify = nobody checked)."
          } >> "$GITHUB_STEP_SUMMARY"

  # 3) VERIFY - the server agent (deploy/agent.sh, systemd timer) pulls the new "prod" image, deploys it with a health gate and
  #    rolls back on failure. This job proves the result from the outside: the public /version must report THIS commit and the
  #    application must be healthy. It fails (and the pipeline is red) if the release does not arrive within the timeout.
  #    Configure the repository VARIABLE PROD_APP_URL (e.g. https://app-xyz.duckdns.org, not a secret). While it is not set the job is
  #    SKIPPED (grey), never green: a skipped Verify means "nobody checked a live deployment", not "deployment is fine".
  verify:
    needs: build
    if: ${{ vars.PROD_APP_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROD_APP_URL: ${{ vars.PROD_APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check that the deployed revision matches this commit
        run: |
          # defensive: the job-level condition already skips this job without PROD_APP_URL; never pass silently if it is empty
          [ -n "$PROD_APP_URL" ] || { echo "::error::PROD_APP_URL is empty"; exit 1; }
          case "$PROD_APP_URL" in https://*) ;; *) echo "::error::PROD_APP_URL must be an https URL"; exit 1 ;; esac
          deadline=$((SECONDS + 900))
          while [ $SECONDS -lt $deadline ]; do
            rev=$(curl -fsS --max-time 10 "${PROD_APP_URL%/}/version" 2>/dev/null | jq -r '.revision // empty' 2>/dev/null || true)
            if [ "$rev" = "$GITHUB_SHA" ]; then
              health=$(curl -fsS --max-time 10 "${PROD_APP_URL%/}/actuator/health" 2>/dev/null | jq -r '.status // empty' 2>/dev/null || true)
              if [ "$health" = UP ]; then
                echo "Deployed ${GITHUB_SHA::7} is live and healthy at ${PROD_APP_URL}"
                echo "### Verified: ${GITHUB_SHA::7} is live and healthy" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "waiting: running revision is '${rev:-<unreachable>}', expected ${GITHUB_SHA::7}"
            sleep 15
          done
          echo "::error::Release ${GITHUB_SHA::7} did not become live at ${PROD_APP_URL} within 15 minutes (the agent rolls back unhealthy releases)"
          exit 1
      # the same release must also serve the application: HTML, runtime configuration (sign-in server), 401 without a token, CSP/cache headers
      - name: Verify the deployed application (shell, configuration, API authorization, headers)
        run: bash scripts/verify-deployment.sh --app-url "$PROD_APP_URL" --expect-revision "$GITHUB_SHA"
