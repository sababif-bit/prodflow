# Local development: PostgreSQL + backend built from source.
#   docker compose up --build
# API: http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prodflow
      POSTGRES_USER: prodflow
      POSTGRES_PASSWORD: ${PRODFLOW_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodflow -d prodflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/prodflow-realm.json:/opt/keycloak/data/import/prodflow-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/prodflow
      DB_USER: prodflow
      DB_PASSWORD: ${PRODFLOW_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: demo
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/prodflow/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy   # without this the backend starts before Postgres is ready

volumes:
  pgdata:
  keycloak_pgdata:
