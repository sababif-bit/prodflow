# DISPOSABLE end-to-end stack for the frontend (never the development stack, never production):
# own Compose project, own volumes, other ports (backend 18080, Keycloak 18180), random secrets from e2e/.stack.env.
# Started and removed by e2e/stack.sh. The realm is imported from keycloak/prodflow-realm.json (client prodflow-web,
# redirect http://localhost:4200/*), so the real sign-in, roles and API rules are exercised.
name: prodflow-fe-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prodflow
      POSTGRES_USER: prodflow
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?run e2e/stack.sh up}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U prodflow -d prodflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${E2E_KC_DB_PASSWORD:?run e2e/stack.sh up}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: e2eadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${E2E_KC_ADMIN_PASSWORD:?run e2e/stack.sh up}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${E2E_KC_DB_PASSWORD:?run e2e/stack.sh up}
      KC_HOSTNAME: http://localhost:18180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # placeholders of the realm import
      PRODFLOW_APP_URL: http://localhost:4200
      DEMO_PLANNER_PASSWORD: ${E2E_PLANNER_PASSWORD:?run e2e/stack.sh up}
      DEMO_PURCHASER_PASSWORD: ${E2E_PURCHASER_PASSWORD:?run e2e/stack.sh up}
      DEMO_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:?run e2e/stack.sh up}
    ports:
      - "127.0.0.1:18180:8080"
    volumes:
      - ../../../keycloak/prodflow-realm.json:/opt/keycloak/data/import/prodflow-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    depends_on:
      keycloak-db:
        condition: service_healthy

  backend:
    image: prodflow-backend:fe-e2e
    build:
      context: ../../../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/prodflow
      DB_USER: prodflow
      DB_PASSWORD: ${E2E_DB_PASSWORD:?run e2e/stack.sh up}
      SPRING_PROFILES_ACTIVE: demo
      OIDC_ISSUER_URI: http://localhost:18180/realms/prodflow
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/prodflow/protocol/openid-connect/certs
      OIDC_AUDIENCE: prodflow-api
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy
