# Production stack on one EC2 instance (ADR #15 proposal, Issues #14/#16): Caddy (HTTPS) -> backend + Keycloak, two PostgreSQL.
# Run from this directory with the server's protected .env (mode 600, see deploy/.env.example):
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
# Every required value uses ${VAR:?}: a missing variable stops Compose instead of starting a weaker configuration.
# Rollback = start the previous IMAGE_TAG again. Only Caddy publishes ports 80/443; Keycloak's admin interface is reachable
# only on 127.0.0.1:8180 of the server (SSH tunnel), never through Caddy.
name: prodflow-prod   # distinct from the local development project "prodflow"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?public hostname of the application}
      AUTH_HOST: ${AUTH_HOST:?public hostname of Keycloak}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
    ports:
      - "${PUBLISH_BIND:-0.0.0.0}:${HTTP_PUBLISH:-80}:80"
      - "${PUBLISH_BIND:-0.0.0.0}:${HTTPS_PUBLISH:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/sababif-bit/prodflow}:${IMAGE_TAG:?image tag (sha-...) to run}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/prodflow
      DB_USER: prodflow
      DB_PASSWORD: ${PRODFLOW_DB_PASSWORD:?}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      OIDC_ISSUER_URI: ${AUTH_URL:?public Keycloak URL, e.g. https://auth.example.org}/realms/prodflow
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/prodflow/protocol/openid-connect/certs
      OIDC_AUDIENCE: prodflow-api
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:?}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # public URL (issuer) behind Caddy; TLS ends at Caddy, the proxy headers carry host/protocol
      KC_HOSTNAME: ${AUTH_URL:?}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # admin console only through the SSH tunnel (127.0.0.1:8180 on the server); Caddy does not route it
      KC_HOSTNAME_ADMIN: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
      # placeholders of keycloak/prodflow-realm.json (first import only; validated by keycloak-import-guard)
      PRODFLOW_APP_URL: ${APP_URL:?public application URL, e.g. https://app.example.org}
      DEMO_PLANNER_PASSWORD: ${DEMO_PLANNER_PASSWORD:?}
      DEMO_PURCHASER_PASSWORD: ${DEMO_PURCHASER_PASSWORD:?}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ../keycloak/prodflow-realm.json:/opt/keycloak/data/import/prodflow-realm.json:ro
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak-import-guard:
        condition: service_completed_successfully

  # Fail-fast guard: validates the demo passwords before the FIRST realm import; does nothing when the realm already exists.
  keycloak-import-guard:
    image: postgres:16-alpine
    entrypoint: ["sh", "/guard/import-guard.sh"]
    environment:
      PGHOST: keycloak-db
      PGDATABASE: ${KEYCLOAK_DB_NAME:?}
      PGUSER: ${KEYCLOAK_DB_USER:?}
      PGPASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      DEMO_PLANNER_PASSWORD: ${DEMO_PLANNER_PASSWORD:?}
      DEMO_PURCHASER_PASSWORD: ${DEMO_PURCHASER_PASSWORD:?}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?}
    volumes:
      - ../keycloak/import-guard.sh:/guard/import-guard.sh:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prodflow
      POSTGRES_USER: prodflow
      POSTGRES_PASSWORD: ${PRODFLOW_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U prodflow -d prodflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  keycloak_pgdata:
  caddy_data:
  caddy_config:
